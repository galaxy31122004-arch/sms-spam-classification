# Rule set cho Tier-1 classical filter (tieng Anh)
# Nguyen tac: rule chi quyet dinh CA NAO phai xuong Tier-2,
# khong duoc tu y ket luan spam/ham thay model.

thresholds:
  spam_confident: 1.0     # decision_function > 1.0 -> spam chac chan
  ham_confident: -1.0     # decision_function < -1.0 -> ham chac chan
  # nam giua hai nguong -> chuyen Tier-2

force_to_tier2:
  # Tier-1 bao ham nhung co dau hieu nguy hiem -> bat xuong Tier-2
  - name: url_la
    type: url_not_allowlisted
    reason: phishing moi thuong qua URL, Tier-1 train tu 2011 de sot

  - name: trung_thuong_vay_viec
    type: keyword_with_contact
    keywords: [win, prize, free, claim, loan, debt, job, offer, crypto, investment]
    reason: mau lua dao kinh dien, can Transformer xac minh ngu nghia

  - name: tin_nhan_rut_gon
    type: shortlink
    domains: [bit.ly, t.co, tinyurl.com]
    reason: shortlink che URL that, classical khong nhin duoc

  - name: so_dien_thoai_la
    type: unknown_sender_phone
    reason: smishing thuong keu goi lai so la

allowlist:
  domains:
    - google.com
    - apple.com
    - bank_domain_cua_ban.com
  # chi ap dung giam nhe, khong hardcode ham vinh vien

normalization:
  lowercase: true
  replace_url: <URL>
  replace_phone: <PHONE>
  replace_money: <MONEY>
  keep_punctuation: ["!", "$", "%"]

logging:
  # log moi ca Tier-1 va Tier-2 bat dong de retrain
  log_disagreement: true
  log_forced_tier2: true
  review_cycle: weekly
